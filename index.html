```

</div>

<script>

async function loadTunnel() {

    try {

        // Cache-busting so the browser doesn't keep an old url.json
        const response = await fetch(
            "url.json?t=" + Date.now()
        );

        if (!response.ok) {
            throw new Error("Could not load url.json");
        }

        const data = await response.json();

        const url = data.url;
        const updated = data.updated;

        if (!url) {
            document.getElementById("status").textContent =
                "🔴 No active tunnel";

            document.getElementById("status").className =
                "offline";

            document.getElementById("url").textContent =
                "No Serveo URL available.";

            return;
        }

        document.getElementById("status").textContent =
            "🟢 V6 TUNNEL ONLINE";

        document.getElementById("status").className =
            "online";

        document.getElementById("url").textContent = url;

        const button = document.getElementById("connect");

        button.style.display = "inline-block";

        button.onclick = function () {
            window.location.href = url;
        };

        if (updated) {

            const date = new Date(updated);

            document.querySelector(".small").textContent =
                "Last updated: " + date.toLocaleString();

        }

    } catch (error) {

        console.error(error);

        document.getElementById("status").textContent =
            "🔴 Unable to load tunnel information";

        document.getElementById("status").className =
            "offline";

        document.getElementById("url").textContent =
            "Could not connect to GitHub data.";

    }

}

loadTunnel();

</script>

</body>
